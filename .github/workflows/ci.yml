name: CI
on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ml:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: ml/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Frozen methodology unchanged since v0.2.0-audited
        working-directory: .
        run: python3 scripts/freeze/manifest.py verify v0.2.0-audited
